appId: com.quickcapitalfunding.contactswidget
productName: QCF Contacts
copyright: Copyright © 2026 Quick Capital Funding
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: .
    filter:
      - tray*.png
      - tray.ico
      - icon.png
asar: true
# Ad-hoc signs the macOS app when no Developer ID is configured (see the script).
afterPack: scripts/adhoc-sign-mac.cjs
mac:
  icon: resources/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: "${productName}-${version}-${arch}.${ext}"
  # Ad-hoc signed by default (afterPack); set CSC_LINK / CSC_KEY_PASSWORD and APPLE_* for Developer ID signing + notarization.
  identity: null
  hardenedRuntime: false
  extendInfo:
    LSUIElement: true
    NSUserNotificationAlertStyle: alert
dmg:
  sign: false
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: "${productName}-${version}-${arch}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: QCF Contacts
portable:
  artifactName: "${productName}-${version}-portable.${ext}"
publish:
  provider: github
  owner: AloNeema
  repo: quick-contacts-widget
  releaseType: draft
