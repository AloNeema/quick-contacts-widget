appId: com.quickcapitalfunding.contactswidget
productName: QCF Contacts
copyright: Copyright © 2026 Quick Capital Funding
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
asar: true
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: "${productName}-${version}-${arch}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: QCF Contacts
portable:
  artifactName: "${productName}-${version}-portable.${ext}"
publish: null
