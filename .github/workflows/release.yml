name: Release

# Manual: creates one draft release, then builds the Windows installer + portable exe (with
# latest.yml) and the macOS builds (with latest-mac.yml) into it, tagged v<package version>. Publish the
# draft to make installed widgets pick it up.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the draft once, before either build uploads. Without this the Windows and macOS jobs
  # can both find no draft at the same moment and each create their own, splitting the assets.
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Create the draft release if it doesn't exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          drafts=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$tag\")] | length")
          if [ "$drafts" -gt 1 ]; then
            echo "::error::There are $drafts releases tagged $tag. Delete the extra drafts, then run this again."
            exit 1
          fi
          if [ "$drafts" -eq 0 ]; then
            gh release create "$tag" --draft --target "${{ github.sha }}" --title "${tag#v}" --notes ""
          fi

  release-mac:
    needs: draft
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Build and publish macOS assets to the draft release
        run: npx electron-vite build && npx electron-builder --mac --config electron-builder.yml --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  release:
    needs: draft
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build and publish draft release
        run: npx electron-vite build && npx electron-builder --win --config electron-builder.yml --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
