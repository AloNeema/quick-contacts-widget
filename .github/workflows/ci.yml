name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-mac:
    name: Build and package (macOS, Apple Silicon + Intel)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Package dmg and zip (unsigned)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify signature and launch the packaged app
        run: |
          set -euo pipefail
          find release -maxdepth 2 -name '*.app' -print0 | while IFS= read -r -d '' app; do
            echo "Checking $app"; codesign --verify --deep --strict --verbose=2 "$app"
          done
          # The runner is Apple Silicon: the arm64 build must start and stay running.
          app=$(find release -maxdepth 2 -path '*arm64*' -name '*.app' | head -n 1)
          "$app/Contents/MacOS/QCF Contacts" --hidden > launch.log 2>&1 &
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "The packaged app exited during startup:"; cat launch.log; exit 1
          fi
          kill "$pid"
          echo "Packaged app started and stayed running."
      - uses: actions/upload-artifact@v5
        with:
          name: qcf-contacts-macos
          path: |
            release/*.dmg
            release/*-mac.zip
            release/*.zip
          if-no-files-found: error
          retention-days: 30

  build:
    name: Test, build and package (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Package installer and portable exe
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Check dark and light appearance in Chromium
        run: npm run test:appearance
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: qcf-contacts-windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30
